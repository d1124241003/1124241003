<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>吳東穎SDGs不塑永續-淨灘</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
        }

        /* 浪花動態效果 */
        @keyframes wave {
            0% { transform: translateX(0) translateZ(0) scaleY(1); }
            50% { transform: translateX(-25%) translateZ(0) scaleY(1.05); }
            100% { transform: translateX(-50%) translateZ(0) scaleY(1); }
        }

        .wave-layer {
            animation: wave 12s cubic-bezier(0.36, 0.45, 0.63, 0.53) infinite;
        }

        .wave-layer-slow {
            animation: wave 18s cubic-bezier(0.36, 0.45, 0.63, 0.53) -4s infinite;
        }

        /* 拾取分數浮動動畫 */
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-50px) scale(1.3); }
        }

        .score-popup {
            position: absolute;
            animation: floatUp 0.8s ease-out forwards;
            pointer-events: none;
            font-weight: 900;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            z-index: 50;
        }

        /* 垃圾彈出效果 */
        @keyframes popIn {
            0% { transform: scale(0) rotate(0deg); opacity: 0; }
            80% { transform: scale(1.15); }
            100% { transform: scale(1); opacity: 1; }
        }

        .trash-item {
            transition: transform 0.15s ease, filter 0.15s ease;
            cursor: pointer;
            filter: drop-shadow(0 3px 5px rgba(0,0,0,0.25));
        }

        .trash-item:hover {
            transform: scale(1.25) !important;
            filter: drop-shadow(0 6px 12px rgba(0,0,0,0.4)) brightness(1.15);
            z-index: 40 !important;
        }

        /* 太陽光暈 */
        .sun-glow {
            box-shadow: 0 0 60px #fef08a, 0 0 120px #fef08a;
        }

        /* 背景氣泡 */
        @keyframes floatBubble {
            0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
            50% { opacity: 0.6; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }

        .bg-bubble {
            position: absolute;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            pointer-events: none;
            animation: floatBubble 8s linear infinite;
        }

        /* 黑狗搖尾巴與跳躍動畫 */
        @keyframes wagTail {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(-25deg); }
        }

        @keyframes dogBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        .dog-tail {
            transform-origin: bottom right;
            animation: wagTail 0.35s infinite ease-in-out;
        }

        .black-dog-body {
            animation: dogBounce 3s infinite ease-in-out;
        }

        /* 牽狗繩微晃動畫 */
        @keyframes leashSway {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(2deg); }
        }
        .leash-container {
            animation: leashSway 2.5s ease-in-out infinite;
        }

        /* 警察跑步追趕動畫 */
        @keyframes copRun {
            0%, 100% { transform: translateY(0) rotate(-2deg); }
            50% { transform: translateY(-6px) rotate(2deg); }
        }
        .cop-running {
            animation: copRun 0.4s infinite ease-in-out;
        }
    </style>
</head>
<body class="h-screen w-screen relative bg-gradient-to-b from-sky-300 via-sky-200 to-amber-100 flex flex-col justify-between overflow-hidden">

    <!-- 頁首與資訊欄 -->
    <header class="relative z-30 w-full p-4 flex flex-wrap justify-between items-center bg-white/40 backdrop-blur-md border-b border-white/30 shadow-sm">
        <!-- 左上角大字粗體標題 -->
        <div class="flex items-center gap-3">
            <div class="bg-emerald-600 text-white p-2.5 rounded-2xl shadow-lg flex items-center justify-center">
                <i class="fa-solid fa-recycle text-2xl"></i>
            </div>
            <div>
                <h1 class="text-2xl sm:text-3xl font-black text-slate-800 tracking-wider">

                <p class="text-xs sm:text-sm text-emerald-800 font-bold">SDG 14 保全海洋生態 • 攜手保護美麗海岸</p>

        </div>

        <!-- 右上角計分板與控制按鈕 -->

                    <span class="text-xs text-slate-500 font-bold block">總分數</span>

            <!-- 控制按鈕 -->

        </div>

        <!-- 前方巡邏員與小狗 -->
        <div id="dog-container" onclick="interactDog(event)" class="leash-container cursor-pointer group transition-transform hover:scale-105 flex items-end gap-1" title="點擊巡邏員與小狗！">
            <!-- 對話氣泡 -->
            <div id="dog-bubble" class="absolute -top-12 left-4 bg-white/95 text-slate-800 text-xs font-black px-3 py-1.5 rounded-2xl shadow-md border border-slate-200 opacity-0 transition-opacity duration-300 pointer-events-none whitespace-nowrap z-30">

    <!-- 遊戲主要區域：海灘 (下半部 55% 高度) -->
    <main id="beach-zone" class="relative z-10 w-full h-[55vh] mt-auto bg-gradient-to-b from-amber-200 via-amber-300 to-yellow-400 shadow-inner overflow-hidden border-t-4 border-amber-300/50">
        <!-- 海灘質感裝飾 -->
        <div class="absolute top-0 left-0 right-0 h-8 bg-amber-400/30 blur-sm"></div>
        <div class="absolute bottom-4 left-10 text-amber-500/20 text-6xl pointer-events-none"><i class="fa-solid fa-umbrella-beach"></i></div>
        <div class="absolute bottom-12 right-16 text-amber-500/20 text-7xl pointer-events-none"><i class="fa-solid fa-water"></i></div>

        <!-- 50 個垃圾動態生成容器 -->
        <div id="trash-container" class="relative w-full h-full"></div>
    </main>

    <!-- 任務成功彈窗 (Modal) -->
    <div id="victory-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-white rounded-3xl p-8 max-w-md w-11/12 text-center shadow-2xl border-4 border-emerald-400 transform scale-90 transition-transform duration-300" id="modal-card">
            <div class="w-24 h-24 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4 text-5xl shadow-inner animate-bounce">
                <i class="fa-solid fa-trophy"></i>
            </div>
            <h2 class="text-3xl font-black text-slate-800 mb-2">任務成功！</h2>
            <p class="text-slate-600 mb-6">太棒了！您成功清理了海岸上的所有垃圾，讓海洋生物有了乾淨的家！</p>
            
            <div class="bg-slate-50 p-4 rounded-2xl mb-6 border border-slate-100 flex justify-around">
                <div>
                    <span class="text-xs text-slate-400 font-bold block">目前總得分</span>
                    <span id="modal-score" class="text-2xl font-black text-amber-500">0</span>
                </div>
                <div class="w-[1px] bg-slate-200"></div>
                <div>
                    <span class="text-xs text-slate-400 font-bold block">清理總數量</span>
                    <span id="modal-cleaned" class="text-2xl font-black text-emerald-500">50</span>
                </div>
            </div>

            <div class="flex gap-4">
                <button onclick="resetGame()" class="flex-1 py-3.5 px-4 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl transition active:scale-95">
                    重新開始
                </button>
                <button onclick="nextLevel()" class="flex-1 py-3.5 px-4 bg-emerald-500 hover:bg-emerald-600 text-white font-bold rounded-xl shadow-lg shadow-emerald-500/30 transition active:scale-95">
                    前往下一關 <i class="fa-solid fa-arrow-right ml-1"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- 遊戲邏輯與腳本 -->
    <script>
        let audioCtx = null;
        let isSoundMuted = false;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // 拾取垃圾音效
        function playPickupSound(points) {
            if (isSoundMuted) return;
            try {
                initAudio();
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sine';
                const pitch = 400 + points * 8;
                osc.frequency.setValueAtTime(pitch, now);
                osc.frequency.exponentialRampToValueAtTime(pitch * 1.5, now + 0.1);

                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(now);
                osc.stop(now + 0.1);
            } catch(e) {}
        }

        // 黑狗汪汪叫音效
        function playBarkSound() {
            if (isSoundMuted) return;
            try {
                initAudio();
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const now = audioCtx.currentTime;
                [0, 0.12].forEach(offset => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();

                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(320, now + offset);
                    osc.frequency.exponentialRampToValueAtTime(160, now + offset + 0.08);

                    gain.gain.setValueAtTime(0.3, now + offset);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + offset + 0.08);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc.start(now + offset);
                    osc.stop(now + offset + 0.08);
                });
            } catch(e) {}
        }

        // 警察鳴笛音效
        function playSirenSound() {
            if (isSoundMuted) return;
            try {
                initAudio();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.linearRampToValueAtTime(900, now + 0.15);
                osc.frequency.linearRampToValueAtTime(600, now + 0.3);

                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(now);
                osc.stop(now + 0.3);
            } catch(e) {}
        }

        // 點擊警察互動
        function interactCop(e) {
            e.stopPropagation();
            playSirenSound();

            const copBubble = document.getElementById('cop-bubble');
            const copMessages = [
                "🚨 站住！全民淨灘，保護海岸環境！",
                "👮 警察巡邏中！感謝你們為海洋付出！",
                "📢 亂丟垃圾將依廢棄物清理法開罰喔！",
                "✨ 警民合作，維護無塑海灘最前線！"
            ];
            copBubble.innerText = copMessages[Math.floor(Math.random() * copMessages.length)];
            copBubble.classList.remove('opacity-0');

            showScorePopup(e.clientX, e.clientY - 20, "👮 嗶嗶！");

            setTimeout(() => {
                copBubble.classList.add('opacity-0');
            }, 2000);
        }

        // 點擊黑狗互動
        function interactDog(e) {
            e.stopPropagation();
            playBarkSound();

            const dogBubble = document.getElementById('dog-bubble');
            const messages = ["汪！巡邏員帶我一起淨灘！🐾", "汪汪！保護大海大家加油！🌊", "你好棒！感謝神隊友淨灘！❤️", "汪！攜手維護無塑海灘！🚮"];
            dogBubble.innerText = messages[Math.floor(Math.random() * messages.length)];
            dogBubble.classList.remove('opacity-0');

            showScorePopup(e.clientX, e.clientY - 20, "🐶 汪！");

            setTimeout(() => {
                dogBubble.classList.add('opacity-0');
            }, 1800);
        }

        // 任務成功音效
        function playVictorySound() {
            if (isSoundMuted) return;
            try {
                initAudio();
                const notes = [261.63, 329.63, 392.00, 523.25];
                notes.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime + idx * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + idx * 0.1 + 0.25);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(audioCtx.currentTime + idx * 0.1);
                    osc.stop(audioCtx.currentTime + idx * 0.1 + 0.25);
                });
            } catch(e) {}
        }

        function toggleSound() {
            isSoundMuted = !isSoundMuted;
            const icon = document.getElementById('sound-icon');
            if (isSoundMuted) {
                icon.className = 'fa-solid fa-volume-xmark text-slate-400';
            } else {
                icon.className = 'fa-solid fa-volume-high text-slate-700';
            }
        }

        // 八種垃圾類型定義
        const TRASH_TYPES = [
            {
                name: '保特瓶',
                category: 'medium',
                points: 20,
                width: 44,
                height: 44,
                svg: `<svg viewBox="0 0 64 64" class="w-full h-full drop-shadow"><path d="M26 8h12v4H26z" fill="#0284c7"/><path d="M28 12h8v6l6 8v26a6 6 0 01-6 6H28a6 6 0 01-6-6V26l6-8v-6z" fill="#38bdf8" opacity="0.85"/><path d="M22 34h20v6H22z" fill="#0ea5e9"/><path d="M30 18h4v34h-4z" fill="#ffffff" opacity="0.4"/></svg>`
            },
            {
                name: '紙類餐盒',
                category: 'medium',
                points: 20,
                width: 48,
                height: 44,
                svg: `<svg viewBox="0 0 64 64" class="w-full h-full drop-shadow"><path d="M10 24l22-10 22 10-6 26H16L10 24z" fill="#d97706"/><path d="M12 24l20-8 20 8-20 6-20-6z" fill="#f59e0b"/><path d="M16 50l-4-26 20 6 20-6-4 26H16z" fill="#b45309" opacity="0.4"/></svg>`
            },
            {
                name: '塑膠袋',
                category: 'large',
                points: 30,
                width: 56,
                height: 56,
                svg: `<svg viewBox="0 0 64 64" class="w-full h-full drop-shadow"><path d="M18 16c-4 0-8 4-6 12l4 28c1 4 6 5 16 5s15-1 16-5l4-28c2-8-2-12-6-12h-6c-1 4-4 6-8 6s-7-2-8-6h-6z" fill="#e2e8f0" opacity="0.85"/><path d="M22 20c2 4 5 5 10 5s8-1 10-5" stroke="#cbd5e1" stroke-width="3" fill="none"/></svg>`
            },
            {
                name: '保麗龍盒',
                category: 'large',
                points: 40,
                width: 54,
                height: 50,
                svg: `<svg viewBox="0 0 64 64" class="w-full h-full drop-shadow"><rect x="10" y="18" width="44" height="32" rx="4" fill="#f8fafc"/><rect x="14" y="14" width="36" height="8" rx="2" fill="#e2e8f0"/><line x1="10" y1="26" x2="54" y2="26" stroke="#cbd5e1" stroke-width="2"/></svg>`
            },
            {
                name: '飲料杯',
                category: 'medium',
                points: 20,
                width: 42,
                height: 48,
                svg: `<svg viewBox="0 0 64 64" class="w-full h-full drop-shadow"><path d="M16 18l5 36h22l5-36H16z" fill="#ec4899" opacity="0.85"/><path d="M12 14h40v5H12z" fill="#db2777"/><path d="M34 6l-6 12" stroke="#f43f5e" stroke-width="4" stroke-linecap="round"/></svg>`
            },
            {
                name: '漂流木',
                category: 'large',
                points: 50,
                width: 64,
                height: 40,
                svg: `<svg viewBox="0 0 64 64" class="w-full h-full drop-shadow"><path d="M8 28c8-4 20 2 32-2s12-6 16-2c-2 6-8 8-16 8s-18-4-26 4-6 0-6-8z" fill="#78350f"/><path d="M16 32c6-1 14 3 22 1" stroke="#92400e" stroke-width="2" fill="none"/></svg>`
            },
            {
                name: '塑膠瓶蓋',
                category: 'small',
                points: 10,
                width: 32,
                height: 32,
                svg: `<svg viewBox="0 0 64 64" class="w-full h-full drop-shadow"><circle cx="32" cy="32" r="20" fill="#ef4444"/><circle cx="32" cy="32" r="14" fill="#dc2626"/><circle cx="32" cy="32" r="8" fill="#b91c1c"/></svg>`
            },
            {
                name: '鋁罐',
                category: 'medium',
                points: 20,
                width: 38,
                height: 46,
                svg: `<svg viewBox="0 0 64 64" class="w-full h-full drop-shadow"><rect x="18" y="14" width="28" height="38" rx="6" fill="#94a3b8"/><ellipse cx="32" cy="14" rx="14" ry="4" fill="#cbd5e1"/><ellipse cx="32" cy="52" rx="14" ry="4" fill="#64748b"/><rect x="18" y="24" width="28" height="16" fill="#ea580c"/></svg>`
            }
        ];

        // 遊戲狀態變數
        const TOTAL_TRASH_COUNT = 50;
        let currentScore = 0;
        let remainingTrash = TOTAL_TRASH_COUNT;
        let currentLevel = 1;

        // 重置遊戲
        function resetGame() {
            currentScore = 0;
            currentLevel = 1;
            startLevel();
        }

        // 前往下一關
        function nextLevel() {
            currentLevel++;
            startLevel();
        }

        // 開始關卡並於海灘放置 50 個隨機垃圾
        function startLevel() {
            remainingTrash = TOTAL_TRASH_COUNT;
            updateUI();
            closeModal();

            const container = document.getElementById('trash-container');
            container.innerHTML = '';

            const containerWidth = container.clientWidth || window.innerWidth;
            const containerHeight = container.clientHeight || (window.innerHeight * 0.55);

            for (let i = 0; i < TOTAL_TRASH_COUNT; i++) {
                const type = TRASH_TYPES[Math.floor(Math.random() * TRASH_TYPES.length)];
                const rotation = Math.floor(Math.random() * 360);

                const padding = 45;
                const posX = Math.random() * (containerWidth - padding * 2) + padding / 2;
                const posY = Math.random() * (containerHeight - padding * 2) + padding / 2;

                const trashEl = document.createElement('div');
                trashEl.className = 'trash-item absolute flex items-center justify-center';
                trashEl.style.width = `${type.width}px`;
                trashEl.style.height = `${type.height}px`;
                trashEl.style.left = `${posX}px`;
                trashEl.style.top = `${posY}px`;
                trashEl.style.transform = `rotate(${rotation}deg)`;
                trashEl.style.animation = `popIn 0.4s ease-out ${Math.random() * 0.5}s both`;
                trashEl.style.zIndex = Math.floor(posY);

                trashEl.innerHTML = type.svg;

                trashEl.addEventListener('click', (e) => collectTrash(e, trashEl, type, posX, posY));

                container.appendChild(trashEl);
            }
        }

        // 撿起垃圾處理
        function collectTrash(e, element, type, x, y) {
            e.stopPropagation();
            
            playPickupSound(type.points);

            currentScore += type.points;
            remainingTrash--;

            showScorePopup(e.clientX || x, e.clientY || y, type.points);

            element.style.pointerEvents = 'none';
            element.style.transform += ' scale(0)';
            element.style.opacity = '0';
            setTimeout(() => {
                element.remove();
            }, 200);

            updateUI();

            if (remainingTrash <= 0) {
                setTimeout(showVictory, 600);
            }
        }

        // 動態浮動得分數字
        function showScorePopup(x, y, points) {
            const popup = document.createElement('div');
            popup.className = 'score-popup text-xl sm:text-2xl';
            
            if (typeof points === 'number') {
                if (points >= 30) {
                    popup.classList.add('text-amber-400');
                } else if (points >= 20) {
                    popup.classList.add('text-emerald-400');
                } else {
                    popup.classList.add('text-sky-300');
                }
                popup.innerText = `+${points}`;
            } else {
                popup.classList.add('text-amber-300');
                popup.innerText = points;
            }

            popup.style.left = `${x - 15}px`;
            popup.style.top = `${y - 20}px`;

            document.body.appendChild(popup);

            setTimeout(() => {
                popup.remove();
            }, 800);
        }

        // 更新數據 UI
        function updateUI() {
            document.getElementById('score-display').innerText = currentScore;
            document.getElementById('remaining-display').innerText = remainingTrash;
            document.getElementById('level-display').innerText = currentLevel;
        }

        // 任務成功視窗
        function showVictory() {
            playVictorySound();
            document.getElementById('modal-score').innerText = currentScore;
            document.getElementById('modal-cleaned').innerText = TOTAL_TRASH_COUNT;
            
            const modal = document.getElementById('victory-modal');
            const card = document.getElementById('modal-card');
            
            modal.classList.remove('opacity-0', 'pointer-events-none');
            card.classList.remove('scale-90');
            card.classList.add('scale-100');
        }

        function closeModal() {
            const modal = document.getElementById('victory-modal');
            const card = document.getElementById('modal-card');
            
            modal.classList.add('opacity-0', 'pointer-events-none');
            card.classList.remove('scale-100');
            card.classList.add('scale-90');
        }

        // 視窗 resize 自動調整
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                if (remainingTrash > 0) {
                    startLevel();
                }
            }, 300);
        });

        window.onload = () => {
            startLevel();
        };
    </script>
</body>
</html>
